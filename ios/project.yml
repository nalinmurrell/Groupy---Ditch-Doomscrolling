name: ChatSnap
options:
  bundleIdPrefix: com.chatsnap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.30.0"

targets:
  ChatSnap:
    type: application
    platform: iOS
    sources:
      - path: ChatSnap
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: ChatSnap/Info.plist
      properties:
        CFBundleDisplayName: ChatSnap
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: ChatSnap opens straight to the camera so you can send a photo to your group in one tap.
        NSMicrophoneUsageDescription: ChatSnap needs the microphone to record sound with your videos.
        NSPhotoLibraryAddUsageDescription: ChatSnap saves snaps you choose to keep to your photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chatsnap.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Ad-hoc ("Sign to Run Locally"). The Supabase SDK keeps the session in
        # the Keychain, which the simulator refuses for an unsigned binary.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
