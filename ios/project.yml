name: ChatSnap
options:
  bundleIdPrefix: com.groupy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.30.0"

targets:
  ChatSnap:
    type: application
    platform: iOS
    sources:
      - path: ChatSnap
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: ChatSnap/ChatSnap.entitlements
      properties:
        # Xcode flips this to production when archiving for TestFlight.
        aps-environment: development
    info:
      path: ChatSnap/Info.plist
      properties:
        CFBundleDisplayName: Groupy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        # HTTPS only — no custom crypto — so no export-compliance prompt per upload.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: ChatSnap opens straight to the camera so you can send a photo to your group in one tap.
        NSMicrophoneUsageDescription: ChatSnap needs the microphone to record sound with your videos.
        NSPhotoLibraryAddUsageDescription: ChatSnap saves snaps you choose to keep to your photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groupy.app
        # Bump CURRENT_PROJECT_VERSION before every TestFlight upload.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Automatic signing with Nalin's paid developer team. Xcode makes the
        # provisioning profile on demand; on the simulator this still signs
        # ad-hoc, which the Supabase SDK needs for Keychain access.
        DEVELOPMENT_TEAM: S9XJ3Y8P67
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
